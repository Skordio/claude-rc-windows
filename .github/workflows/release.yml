name: Release

# SPEC 14: on a v* tag, test, publish x64 and arm64 (self-contained single-file), build the
# installers and portable zips, and attach everything to a GitHub Release with SHA-256 sums.
# Run by hand (workflow_dispatch) it is a dry run by default: everything is built and uploaded as
# workflow artifacts, and no release is created.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload workflow artifacts only; create no release (a release also needs a v* tag ref)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The official Inno Setup installer, pinned by version and SHA-256 (the hash winget's manifest lists).
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
  INNO_SETUP_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          # v1.2.3 -> 1.2.3; a dry run on a branch gets 0.0.0-dryrun.<run number>.
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME -replace '^v', '' }
          else { $v = "0.0.0-dryrun.$env:GITHUB_RUN_NUMBER" }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw "not a v<major>.<minor>.<patch>[-pre] tag: $env:GITHUB_REF_NAME" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version $v"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build --blame-hang-timeout 10m --logger "console;verbosity=normal"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest $env:INNO_SETUP_URL -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup installer hash $hash, expected $env:INNO_SETUP_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed with exit code $($p.ExitCode)" }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found in $dir" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Publish, installers, portable zips, checksums
        shell: pwsh
        run: ./build/publish.ps1 -Version '${{ steps.version.outputs.version }}' -Iscc $env:ISCC

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-rc-windows-${{ steps.version.outputs.version }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    # Tags only; a hand-run on a tag releases only when dry_run is unticked.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: claude-rc-windows-${{ needs.build.outputs.version }}
          path: release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          cat > ../notes.md <<EOF
          claude-rc-windows $VERSION. Unofficial; not affiliated with or endorsed by Anthropic.

          - **Installer** (per-user, no administrator rights): \`claude-rc-windows-$VERSION-win-x64-setup.exe\`, or \`-win-arm64-setup.exe\` for Windows on Arm.
          - **Portable**: \`claude-rc-windows-$VERSION-win-x64-portable.zip\` / \`-win-arm64-portable.zip\`.
          - \`SHA256SUMS.txt\` has the SHA-256 of every file.

          The files are not code-signed: Windows SmartScreen shows "Windows protected your PC". Choose **More info**, then **Run anyway**. See the README for requirements and usage.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "claude-rc-windows $VERSION" --notes-file ../notes.md "${prerelease[@]}" ./*
